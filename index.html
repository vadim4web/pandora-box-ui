
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-3D CSS Menu</title>

  <style>
    :root {
      background: radial-gradient(
        circle at center,
        #808080 0%,
        #202020 100%
      );
    }

    body *,
    ::before,
    ::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow: hidden;
    }

    .scene {
      /* Scale every face and offset together, up to the original 3x size. */
      font-size: min(3rem, calc((100vw - 2rem) / 10), calc((100vh - 2rem) / 10.5));
      font-size: min(3rem, calc((100vw - 2rem) / 10), calc((100svh - 2rem) / 10.5));
      font-family: 'Times New Roman', Times, serif;
      font-weight: bolder;
      /* Original landscape line box: 55px at a 48px font size. */
      line-height: calc(55 / 48);
      letter-spacing: 0.075ch;
      display: flex;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 50%;
      top: 50dvh;
      left: 50%;
      transform: translate(-50%, -50%);
      /* Face geometry must not depend on the device's serif digit width. */
      width: 17em;
      /* Keep the landscape artboard proportions at every viewport size. */
      height: 14.625em;
    }

    ul {
      list-style: none;
      padding: 0;
      position: relative;
      width: 50%;
      top: -2.5%;
      left: 5%;

      transform:
        rotateX(30deg)
        rotateY(-25deg)
        rotateZ(13deg)
        scaleX(0.66)
        scaleY(1);

      li {
        padding-left: 0.75em;

        /* Front face — default */
        background: #808080;
        box-shadow: 0 0 0.0625em #aaa;
        color: white;

        position: relative;
        transform: translateX(0%);

        transition:
          transform 0.857s,
          background-color 1s;

        cursor: pointer;

        /* Left side face */
        &::before {
          transition:
            left 1s,
            box-shadow 1s,
            background-color 1s,
            filter 1s;

          background-color: #606060;
          box-shadow: 0 0 0.0625em #777;

          background-position: center;
          background-repeat: no-repeat;
          background-size: 25%;

          position: absolute;
          content: "";
          width: 50%;
          height: 100%;
          left: -38%;

          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;

          transform:
            rotateX(14.5deg)
            rotateY(60deg)
            translateX(0.125em)
            translateY(-0.5em);
        }

        /* CMY with RGB between them: cyan, green, yellow, red, magenta, blue. */
        --highlight-top: calc(var(--highlight-lightness) + 14%);

        &:nth-child(1) {
          --highlight-hue: 180;
          --highlight-lightness: 28%;
        }

        &:nth-child(2) {
          --highlight-hue: 120;
          --highlight-lightness: 30%;
        }

        &:nth-child(3) {
          --highlight-hue: 60;
          --highlight-lightness: 26%;
          --highlight-top: 52%;
        }

        &:nth-child(4) {
          --highlight-hue: 0;
          --highlight-lightness: 48%;
        }

        &:nth-child(5) {
          --highlight-hue: 300;
          --highlight-lightness: 43%;
        }

        &:nth-child(6) {
          --highlight-hue: 240;
          --highlight-lightness: 62%;
        }

        /* Move only the hovered block */
        &:hover {
          background-color: hsl(var(--highlight-hue), 80%, var(--highlight-lightness));
          transform: translateX(-8%);

          &::before {
            background-color: hsl(var(--highlight-hue), 80%, calc(var(--highlight-lightness) - 9%));
            box-shadow: 0 0 0.0625em hsl(var(--highlight-hue), 80%, calc(var(--highlight-lightness) - 18%));
            background-position: center;
            background-repeat: no-repeat;
            background-size: 25%;

            transition:
              left 1s,
              box-shadow 1s,
              background-color 1s;
          }
        }

        /*
         * SHADOW FIX
         *
         * Darken ONLY the left side faces (::before)
         * of the following sibling elements.
         *
         * Their front faces remain unchanged.
         */
        &:hover ~ li::before {
          background-color: #505050;
        }

        /* Stacking order */
        &:nth-child(1) { z-index: 6; }
        &:nth-child(2) { z-index: 5; }
        &:nth-child(3) { z-index: 4; }
        &:nth-child(4) { z-index: 3; }
        &:nth-child(5) { z-index: 2; }
        &:nth-child(6) { z-index: 1; }

        /* Top faces */
        &::after {
          background: #555;
          box-shadow: 0 0 0.0625em #555;
          transition: background-color 1s, box-shadow 1s;

          position: absolute;
          content: "";
          height: 50%;
          width: calc(100% + 0.125em);
          top: -26%;
          left: 29%;

          transform:
            rotateX(102deg)
            rotateY(10deg)
            rotateZ(39deg)
            scaleX(1.29)
            scaleY(6)
            translateY(160%)
            translateZ(-1.0625em);
        }

        /* Icons */
        &:nth-child(1)::before {
          z-index: 6;
          background-image: url("icons8-home.svg");
        }

        &:nth-child(2)::before {
          z-index: 5;
          background-image: url("icons8-info.svg");
        }

        &:nth-child(3)::before {
          z-index: 4;
          background-image: url("icons8-services.svg");
        }

        &:nth-child(4)::before {
          z-index: 3;
          background-image: url("icons8-briefcase.svg");
        }

        &:nth-child(5)::before {
          z-index: 2;
          background-image: url("icons8-team.svg");
        }

        &:nth-child(6)::before {
          z-index: 1;
          background-image: url("icons8-contacts.svg");
        }

        /* Top face stacking */
        &:nth-child(1)::after {
          z-index: 6;
          background: #707070;
        }

        &:nth-child(2)::after { z-index: 5; }
        &:nth-child(3)::after { z-index: 4; }
        &:nth-child(4)::after { z-index: 3; }
        &:nth-child(5)::after { z-index: 2; }
        &:nth-child(6)::after { z-index: 1; }

        &:hover::after {
          background-color: hsl(var(--highlight-hue), 80%, var(--highlight-top));
          box-shadow: 0 0 0.0625em hsl(var(--highlight-hue), 80%, var(--highlight-top));
        }
      }

      /* Ground shadow */
      &::before {
        background: #202020;
        position: absolute;
        content: "";

        height: 50%;
        width: calc(100% + 0.125em);
        top: 100%;
        left: -0.0625em;

        transition: transform 0.75s;

        transform:
          rotateX(102deg)
          rotateY(10deg)
          rotateZ(39deg)
          scaleX(1.29)
          scaleY(0.9)
          translateX(13.5%)
          translateY(100%)
          translateZ(-0.8125em)
          scaleX(1.2)
          scaleY(1.2);

        filter: blur(0.75em);
      }

      /* Ground shadow on hover */
      &:has(:hover)::before {
        transition: transform 0.75s;

        transform:
          rotateX(102deg)
          rotateY(10deg)
          rotateZ(39deg)
          scaleX(1.37)
          scaleY(0.9)
          translateX(9%)
          translateY(100%)
          translateZ(-0.8125em)
          scaleX(1.2)
          scaleY(1.2);
      }
    }
  </style>
</head>

<body>
  <main class="scene" aria-label="Main menu">
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Service</li>
      <li>Portfolio</li>
      <li>Our Team</li>
      <li>Contact</li>
    </ul>
  </main>
</body>
</html>
