<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-3D CSS Menu</title>
  <style>
    :root {
      zoom: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, #808080 0%, #202020 100%)
        ;
    }

    body *, ::before, ::after { box-sizing: border-box; }

    body {
      font-family: 'Times New Roman', Times, serif;
      font-weight: bolder;
      letter-spacing: 0.075ch;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: calc((100vmin / 3) - 6px);
      width: calc((100vmin / 3) - 6px);
      min-width: 33ch;
    }

    ul {
      list-style: none;
      padding: 0;
      position: relative;
      width: 50%;
      left: 12.5%;
      transform:
        rotateX(30deg)
        rotateY(-25deg)
        rotateZ(13deg)
        scaleX(0.66)
        scaleY(1)
        ;

      li {
        padding-left: 0.75rem;
        background: #808080;
        box-shadow: 0 0 1px #a0a0a0;
        color: white;
        position: relative;
        transform: translateX(0%);
        transition: transform 0.857s;
        cursor: pointer;

        &::before {
          background: #606060;
          box-shadow: 0 0 1px #888;
          background-position: center;
          background-repeat: no-repeat;
          background-size: 25%;
          position: absolute;
          content: "";
          width: 50%;
          height: 100%;
          left: -38%;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          transform:
            rotateX(14.5deg)
            rotateY(60deg)
            translateY(-8px)
            ;
        }

        &:hover {
          background: #60a070;
          transform: translateX(-8%);
          transition: transform .857s;
          &::before {
            background: #204030;
            box-shadow: 0 0 1px #204030;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 25%;
            transition: left 1s, box-shadow 1s;
            transform:
              rotateX(14.5deg)
              rotateY(60deg)
              translateY(-8px)
              ;
          }
        }

        &:nth-child(1) { z-index: 6; }
        &:nth-child(2) { z-index: 5; }
        &:nth-child(3) { z-index: 4; }
        &:nth-child(4) { z-index: 3; }
        &:nth-child(5) { z-index: 2; }
        &:nth-child(6) { z-index: 1; }

        &:nth-child(1)::after,
        &:nth-child(2)::after,
        &:nth-child(3)::after,
        &:nth-child(4)::after,
        &:nth-child(5)::after,
        &:nth-child(6)::after {
          background: #505050;
          box-shadow: 0 0 1px #505050;
          position: absolute;
          content: "";
          height: 50%;
          width: calc(100% + 2px);
          top: -26%;
          left: 29%;
          transform:
            rotateX(102deg)
            rotateY(10deg)
            rotateZ(39deg)
            scaleX(1.29)
            scaleY(6)
            translateY(160%)
            translateZ(-17px)
            ;
        }

        &:nth-child(1)::before {
          z-index: 6;
          background-image: url("icons8-home.svg");
        }
        &:nth-child(2)::before {
          z-index: 5;
          background-image: url("icons8-info.svg");
        }
        &:nth-child(3)::before {
          z-index: 4;
          background-image: url("icons8-services.svg");
        }
        &:nth-child(4)::before {
          z-index: 3;
          background-image: url("icons8-briefcase.svg"); }
        &:nth-child(5)::before {
          z-index: 2;
          background-image: url("icons8-contacts.svg");
        }
        &:nth-child(6)::before {
          z-index: 1;
          background-image: url("icons8-team.svg");
        }

        &:nth-child(1)::after { z-index: 6; background: #707070; }
        &:nth-child(2)::after { z-index: 5; }
        &:nth-child(3)::after { z-index: 4; }
        &:nth-child(4)::after { z-index: 3; }
        &:nth-child(5)::after { z-index: 2; }
        &:nth-child(6)::after { z-index: 1; }
      }

      &::before {
          background: #202020;
          position: absolute;
          content: "";
          height: 50%;
          width: calc(100% + 2px);
          top: 100%;
          left: -1px;
          transition: transform 0.75s;
          transform:
            rotateX(102deg)
            rotateY(10deg)
            rotateZ(39deg)
            scaleX(1.29)
            scaleY(0.9)
            translateX(13.5%)
            translateY(100%)
            translateZ(-13px)
            scaleX(1.2)
            scaleY(1.2)
            ;
          filter: blur(0.75rem);
      }

      &:has(:hover)::before {
        transition: transform 0.75s;
        transform:
            rotateX(102deg)
            rotateY(10deg)
            rotateZ(39deg)
            scaleX(1.37)
            scaleY(0.9)
            translateX(9%)
            translateY(100%)
            translateZ(-13px)
            scaleX(1.2)
            scaleY(1.2)
            ;
      }
    }
  </style>
</head>
<body>
  <ul>
    <li>Home</li>
    <li>About</li>
    <li>Service</li>
    <li>Portfolio</li>
    <li>Our Team</li>
    <li>Contact</li>
  </ul>
</body>
</html>
